<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AR Vision - Interactive Bounding Box Calibrator</title>
    <!-- Crucial for mobile interaction -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> 
    <style>
        body { font-family: system-ui, sans-serif; background: #0F172A; color: #F8FAFC; margin: 0; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        #app-viewport { display: flex; gap: 10px; width: 100%; }
        #canvas-container { position: relative; border: 2px solid #38BDF8; display: inline-block; flex-shrink: 0; }
        canvas { display: block; cursor: crosshair; touch-action: none; /* Disable native browser touch handling */ }
        #controls { flex: 1; background: #1E293B; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
        button { background: #0284C7; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        button:hover { background: #0369A1; }
        .target-btn { display: flex; gap: 8px; }
        .target-btn button { flex: 1; opacity: 0.6; }
        .target-btn button.active { opacity: 1.0; border: 2px solid #FFF; }
        pre { background: #0F172A; padding: 8px; border-radius: 6px; font-size: 10px; max-height: 150px; overflow-y: auto; color: #81E6D9; }
        
        /* Layout fix for iPad Portrait mode */
        @media (max-width: 768px) {
            #app-viewport { flex-direction: column; align-items: center; }
            #canvas-container { order: 1; }
            #controls { order: 2; width: 100%; max-width: 500px; }
        }
    </style>
</head>
<body>

    <div id="app-viewport">
        <div id="canvas-container">
            <canvas id="editorCanvas"></canvas>
        </div>

        <div id="controls">
            <h3>AR Tracker Calibrator</h3>
            <div>
                <label>Video Time (s): <span id="timeVal">0.00</span></label>
                <input type="range" id="timeSlider" min="0" max="22" step="0.5" value="0" style="width:100%;">
            </div>

            <div class="target-btn">
                <button id="btnContainer" class="active" onclick="selectTarget('container')" style="background:#10B981;">Container</button>
                <button id="btnTruck" onclick="selectTarget('truck')" style="background:#0284C7;">Truck Cab</button>
            </div>

            <label><input type="checkbox" id="partialCheck"> Partially Visible / Edge Cropped</label>
            <label><input type="checkbox" id="offscreenCheck"> Off-Screen (Hide Box)</label>

            <button onclick="saveCurrentKeyframe()">Set Control Keyframe</button>
            <button onclick="exportJSON()" style="background:#059669;">Export Control JSON</button>

            <h4>Keyframes Recorded:</h4>
            <pre id="jsonPreview">{}</pre>
        </div>
    </div>

    <script>
        const video = document.createElement('video');
        video.src = '15969738_540_960_30fps.mp4';
        video.crossOrigin = 'anonymous';

        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const timeSlider = document.getElementById('timeSlider');
        const timeVal = document.getElementById('timeVal');

        let currentTarget = 'container';
        let keyframes = { container: [], truck: [] };
        
        // Initial coordinates normalized
        let activeBoxes = {
            container: { x: 0.38, y: 0.26, w: 0.31, h: 0.24, partial: true, offscreen: false },
            truck: { x: 0.03, y: 0.34, w: 0.22, h: 0.30, partial: true, offscreen: false }
        };

        let draggingCorner = null;
        // Increase corner size for mobile touch
        const cornerSize = 20; 

        video.addEventListener('loadedmetadata', () => {
            // Adaptive scale for iPad screen width (max 480w)
            const scaleFactor = 0.5;
            canvas.width = video.videoWidth * scaleFactor;
            canvas.height = video.videoHeight * scaleFactor;
            timeSlider.max = video.duration;
            renderFrame();
        });

        timeSlider.addEventListener('input', (e) => {
            video.currentTime = e.target.value;
            timeVal.innerText = parseFloat(e.target.value).toFixed(2);
        });

        video.addEventListener('seeked', renderFrame);

        function selectTarget(target) {
            currentTarget = target;
            document.getElementById('btnContainer').classList.toggle('active', target === 'container');
            document.getElementById('btnTruck').classList.toggle('active', target === 'truck');
            renderFrame();
        }

        function renderFrame() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            ['container', 'truck'].forEach(target => {
                const box = activeBoxes[target];
                if (box.offscreen) return;

                const color = target === 'container' ? '#10B981' : '#0284C7';
                const bx = box.x * canvas.width;
                const by = box.y * canvas.height;
                const bw = box.w * canvas.width;
                const bh = box.h * canvas.height;

                ctx.strokeStyle = color;
                ctx.lineWidth = target === currentTarget ? 3 : 1.5;
                ctx.strokeRect(bx, by, bw, bh);

                if (target === currentTarget) {
                    // Larger, obvious white touch corners for iPad
                    ctx.fillStyle = '#FFFFFF';
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 1;
                    [[bx, by], [bx + bw, by], [bx, by + bh], [bx + bw, by + bh]].forEach(([cx, cy]) => {
                        ctx.beginPath();
                        ctx.arc(cx, cy, cornerSize/2, 0, Math.PI*2);
                        ctx.fill();
                        ctx.stroke();
                    });
                }
            });
        }

        // --- NEW! NATIVE TOUCH EVENT LOGIC FOR IPAD ---

        function handleStart(e) {
            e.preventDefault();
            let touchX, touchY;
