<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LOGIX AR Vision - Precision Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #080C10; font-family: system-ui, -apple-system, sans-serif; color: #E2E8F0; }
        #app-viewport { display: flex; width: 100vw; height: 100vh; }
        #video-container { position: relative; flex: 1; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
        #webcam { width: 100%; height: 100%; object-fit: contain; }
        #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        #side-panel { width: 380px; height: 100%; background: #0F172A; border-left: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; padding: 20px; gap: 16px; z-index: 10; overflow-y: auto; }
        .panel-header { font-size: 14px; font-weight: 700; color: #38BDF8; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 10px; padding: 3px 8px; border-radius: 12px; font-weight: 600; text-transform: uppercase; background: rgba(16, 185, 129, 0.2); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.4); }
        .card { display: none; background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 12px; padding: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); }
        .card.active { display: block; }
        .card-title { font-size: 11px; color: #94A3B8; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .card-main-val { font-size: 18px; font-weight: 700; font-family: monospace; color: #F8FAFC; margin-bottom: 10px; }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; }
        .data-label { color: #64748B; } .data-val { color: #CBD5E1; font-weight: 600; }
        #top-bar { position: absolute; top: 16px; left: 16px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); font-size: 12px; z-index: 10; display: flex; gap: 12px; align-items: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #10B981; box-shadow: 0 0 8px #10B981; }
        
        /* Export Button Styling */
        #export-btn {
            background: #0284C7;
            color: #FFF;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: 8px;
        }
        #export-btn:hover { background: #0369A1; }
        #export-btn.recording { background: #EF4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="app-viewport">
        <div id="video-container">
            <div id="top-bar">
                <div style="display:flex; align-items:center; gap:6px;"><span class="dot"></span> AR VISION OCR</div>
                <div id="time-display">00:00</div>
                <button id="export-btn" onclick="toggleRecord()">RECORD & EXPORT</button>
            </div>
            <video id="webcam" src="15969738_540_960_30fps.mp4" autoplay playsinline muted loop crossorigin="anonymous"></video>
            <canvas id="overlay-canvas"></canvas>
        </div>

        <div id="side-panel">
            <div class="panel-header">CONTAINER YARD TELEMETRY <span class="badge">AI SYNCED</span></div>
            
            <div id="container-card" class="card">
                <div class="card-title"><span>CONTAINER IDENTIFIER</span><span style="color:#10B981;">TRACKED</span></div>
                <div class="card-main-val">EGSU 021124 8</div>
                <div class="card-grid">
                    <div><span class="data-label">OPERATOR:</span> <span class="data-val">EVERGREEN</span></div>
                    <div><span class="data-label">TYPE:</span> <span class="data-val">22G1 (20FT)</span></div>
                    <div><span class="data-label">COLOR:</span> <span class="data-val">GREEN</span></div>
                    <div><span class="data-label">OCR CONF:</span> <span class="data-val">98.4%</span></div>
                </div>
            </div>

            <div id="truck-card" class="card">
                <div class="card-title"><span>PRIME MOVER FLEET</span><span style="color:#00E5FF;">TRACKED</span></div>
                <div class="card-main-val">SLA 01</div>
                <div class="card-grid">
                    <div><span class="data-label">MODEL:</span> <span class="data-val">SCANIA R-SERIES</span></div>
                    <div><span class="data-label">STATUS:</span> <span class="data-val">IN TRANSIT</span></div>
                    <div><span class="data-label">DEST:</span> <span class="data-val">YARD ZONE B</span></div>
                    <div><span class="data-label">SPEED:</span> <span class="data-val">12 KM/H</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay-canvas');
        const ctx = canvas.getContext('2d');
        const timeDisplay = document.getElementById('time-display');
        const exportBtn = document.getElementById('export-btn');

        let trackingData = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        // Fetch pre-computed AI tracks JSON
        fetch('tracks.json')
            .then(res => res.json())
            .then(data => {
                trackingData = data;
                console.log("AI Tracking Data Loaded Successfully!");
            })
            .catch(err => console.error("Error loading tracks.json:", err));

        function resizeCanvas() {
            canvas.width = video.clientWidth;
            canvas.height = video.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        video.addEventListener('loadedmetadata', resizeCanvas);

        function getRenderedVideoRect() {
            const vw = video.videoWidth || 540, vh = video.videoHeight || 960;
            const cw = video.clientWidth, ch = video.clientHeight;
            const vRatio = vw / vh, cRatio = cw / ch;
            let rw, rh, rx, ry;
            if (cRatio > vRatio) { rh = ch; rw = rh * vRatio; rx = (cw - rw) / 2; ry = 0; }
            else { rw = cw; rh = rw / vRatio; rx = 0; ry = (ch - rh) / 2; }
            return { x: rx, y: ry, w: rw, h: rh };
        }

        function getTrackDataForTime(array, currentTime) {
            if (!array || array.length === 0) return null;
            let closest = array[0];
            let minDiff = Math.abs(closest.t - currentTime);
            for (let i = 1; i < array.length; i++) {
                let diff = Math.abs(array[i].t - currentTime);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = array[i];
                }
            }
            return minDiff < 0.25 ? closest : null;
        }

        function drawHollowBox(box, color, label, sub, vRect) {
            const x = vRect.x + (box.x * vRect.w);
            const y = vRect.y + (box.y * vRect.h);
            const w = box.w * vRect.w;
            const h = box.h * vRect.h;

            ctx.strokeStyle = color; 
            ctx.lineWidth = 2.5; 
            ctx.strokeRect(x, y, w, h);

            // HUD Corner Brackets
            const len = 12; 
            ctx.strokeStyle = '#FFF'; 
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x, y + h - len); ctx.lineTo(x, y + h); ctx.lineTo(x + len, y + h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - len); ctx.stroke();

            // Floating Label Banner
            ctx.fillStyle = color; 
            ctx.fillRect(x, y - 26, 130, 22);
            ctx.fillStyle = '#000'; 
            ctx.font = 'bold 10px sans-serif'; 
            ctx.fillText(label, x + 6, y - 12);
            ctx.font = '8px sans-serif';
            ctx.fillText(sub, x + 6, y - 3);
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const t = video.currentTime;
            timeDisplay.innerText = `00:${Math.floor(t).toString().padStart(2, '0')}`;
            const vRect = getRenderedVideoRect();

            if (trackingData) {
                const cTrack = getTrackDataForTime(trackingData.container, t);
                const tTrack = getTrackDataForTime(trackingData.truck, t);

                if (cTrack) {
                    drawHollowBox(cTrack, '#00FF66', 'EGSU 021124 8', 'EVERGREEN 20FT', vRect);
                    document.getElementById('container-card').classList.add('active');
                } else {
                    document.getElementById('container-card').classList.remove('active');
                }

                if (tTrack) {
                    drawHollowBox(tTrack, '#00E5FF', 'TRUCK: SLA 01', 'SCANIA R-SERIES', vRect);
                    document.getElementById('truck-card').classList.add('active');
                } else {
                    document.getElementById('truck-card').classList.remove('active');
                }
            }

            requestAnimationFrame(renderLoop);
        }

        // --- Native Video Recording & Export Pipeline ---
        function toggleRecord() {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        function startRecording() {
            recordedChunks = [];
            
            // Create a composite offscreen canvas that merges the video frame + HUD overlay
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = video.videoWidth || 540;
            exportCanvas.height = video.videoHeight || 960;
            const exportCtx = exportCanvas.getContext('2d');

            const stream = exportCanvas.captureStream(30);
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = saveVideo;

            function drawComposite() {
                if (!isRecording) return;
                exportCtx.drawImage(video, 0, 0, exportCanvas.width, exportCanvas.height);
                exportCtx.drawImage(canvas, 0, 0, exportCanvas.width, exportCanvas.height);
                requestAnimationFrame(drawComposite);
            }

            mediaRecorder.start();
            isRecording = true;
            exportBtn.innerText = "STOP & SAVE";
            exportBtn.classList.add("recording");
            
            // Restart video to capture full playback sequence
            video.currentTime = 0;
            video.play();
            drawComposite();
        }

        function stopRecording() {
            isRecording = false;
            mediaRecorder.stop();
            exportBtn.innerText = "RECORD & EXPORT";
            exportBtn.classList.remove("recording");
        }

        function saveVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `AR_Logistics_Output_${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
        }

        video.addEventListener('play', () => { resizeCanvas(); requestAnimationFrame(renderLoop); });
        window.addEventListener('load', () => { resizeCanvas(); renderLoop(); });
    </script>
</body>
</html>
